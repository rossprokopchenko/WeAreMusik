# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  schema_search_path: 'public,musicbrainz'

development:
  <<: *default
  database: <%= Rails.application.credentials.dig(:pg_database) %>
  username: <%= Rails.application.credentials.dig(:pg_user) %>
  password: <%= Rails.application.credentials.dig(:pg_password) %>
  host: localhost
  port: 5432
  schema_search_path: 'public,musicbrainz'

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: WeAreMusik_test
  schema_search_path: 'public,musicbrainz'


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  <<: *default
  database: WeAreMusik_production
  schema_search_path: 'public,musicbrainz'
  database: <%= Rails.application.credentials.dig(:pg_database_prod) %>
  username: <%= Rails.application.credentials.dig(:pg_user_prod) %>
  password: <%= Rails.application.credentials.dig(:pg_password_prod) %>

cable:
  production:
    <<: *default
    database: <%= Rails.application.credentials.dig(:pg_database_prod) %>
    username: <%= Rails.application.credentials.dig(:pg_user_prod) %>
    password: <%= Rails.application.credentials.dig(:pg_password_prod) %>
    host: localhost
    port: 5432

cache:
  production:
    <<: *default
    database: <%= Rails.application.credentials.dig(:pg_database_prod) %>
    username: <%= Rails.application.credentials.dig(:pg_user_prod) %>
    password: <%= Rails.application.credentials.dig(:pg_password_prod) %>
    host: localhost
    port: 5432

queue:
  production:
    <<: *default
    database: <%= Rails.application.credentials.dig(:pg_database_prod) %>
    username: <%= Rails.application.credentials.dig(:pg_user_prod) %>
    password: <%= Rails.application.credentials.dig(:pg_password_prod) %>
    host: localhost
    port: 5432